<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#e8ff47"/>
  <meta name="description" content="Futebol ao vivo grátis"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/logo-32.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/logo-192.png"/>
  <link rel="shortcut icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" href="/static/icons/logo-192.png"/>
  <meta name="google-adsense-account" content="ca-pub-7138876950922476">
  <title>Gol AO VIVO TV</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;
      --accent:#e8ff47;--accent2:#47ffe8;--text:#e8e8f0;
      --muted:#555570;--error:#ff4757;--warn:#ffaa00;
    }
    body{
      background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;padding:40px 20px;gap:24px;
    }
    body.compact .log{display:none}
    body::before{
      content:'';position:fixed;inset:0;
      background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
      background-size:48px 48px;opacity:.25;pointer-events:none;z-index:0;
    }
    header{position:relative;z-index:1;text-align:center}
    header h1{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;color:var(--accent)}
    .video-wrap{
      position:relative;z-index:1;width:100%;max-width:900px;
      aspect-ratio:16/9;background:#000;border-radius:12px;
      overflow:hidden;border:1px solid var(--border);
    }
    #player{width:100%;height:100%;border:none;display:block}
    .no-signal{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:'DM Mono',monospace;font-size:.85rem;color:var(--muted);
      background:#000;
    }
    .no-signal.hidden{display:none}
    .provider-bar{
      position:relative;z-index:1;width:100%;max-width:900px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:10px 16px;
      display:none;align-items:center;gap:10px;flex-wrap:wrap;
    }
    .provider-bar.visible{display:flex}
    .provider-label{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
    .prov-btn,.fs-btn{
      background:transparent;border:1px solid var(--border);color:var(--muted);
      font-family:'DM Mono',monospace;font-size:.72rem;
      border-radius:6px;padding:5px 12px;cursor:pointer;transition:all .15s;white-space:nowrap;
    }
    .prov-btn:hover,.fs-btn:hover{border-color:var(--accent2);color:var(--accent2)}
    .prov-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(71,255,232,.07)}
    .fs-btn{margin-left:auto}
    .channels{
      position:relative;z-index:1;width:100%;max-width:900px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;
    }
    .channels-title{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
    .channels-list{display:flex;flex-wrap:wrap;gap:8px}
    .ch-btn{
      background:transparent;border:1px solid var(--border);color:var(--text);
      font-family:'DM Mono',monospace;font-size:.78rem;font-weight:500;
      border-radius:6px;padding:7px 14px;cursor:pointer;transition:all .15s;
    }
    .ch-btn:hover{border-color:var(--accent);color:var(--accent)}
    .ch-btn.active{border-color:var(--accent);color:#000;background:var(--accent)}
    .ch-empty{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted)}
    .log{
      position:relative;z-index:1;width:100%;max-width:900px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:10px;padding:12px 16px;max-height:150px;overflow-y:auto;
    }
    .ll{font-family:'DM Mono',monospace;font-size:.72rem;padding:2px 0;border-bottom:1px solid #15151f;color:var(--muted);animation:fi .2s ease}
    .ll.ok{color:var(--accent)} .ll.err{color:var(--error)} .ll.inf{color:var(--accent2)} .ll.warn{color:var(--warn)}
    @keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
    ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  </style>
</head>
<body class="{{ 'show-log' if show_log else 'compact' }}">
<header>
  <h1>⚽ GOL AO VIVO TV</h1>
</header>

<div class="video-wrap">
  <iframe id="player" src="about:blank"
          allowfullscreen
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          referrerpolicy="no-referrer"></iframe>
  <div class="no-signal" id="no-signal">Selecione um canal</div>
</div>

<div class="provider-bar" id="provider-bar">
  <span class="provider-label">FONTE</span>
  <div id="provider-list" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <button class="fs-btn" onclick="toggleFullscreen()">⛶ TELA CHEIA</button>
</div>

<div class="channels" id="channels-wrap">
  <div class="channels-title">Canais disponíveis</div>
  <div class="channels-list" id="channels-list">
    <span class="ch-empty">Buscando canais...</span>
  </div>
</div>

<div class="log" id="log"></div>

<script>
let activeChannel = null;
let autoStartDone = false;
let channelMap = {};

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

function log(msg, t=""){
  const d = document.getElementById("log");
  const l = document.createElement("div");
  l.className = "ll " + t;
  l.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
  d.appendChild(l);
  d.scrollTop = d.scrollHeight;
}

function loadEmbed(url, provBtns, idx){
  document.getElementById("player").src = url;
  document.getElementById("no-signal").classList.add("hidden");
  provBtns.forEach((b, i) => b.classList.toggle("active", i === idx));
}

function selectChannel(name){
  const ch = channelMap[name];
  if(!ch) return;

  activeChannel = name;
  document.querySelectorAll(".ch-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.name === name)
  );

  const bar = document.getElementById("provider-bar");
  const list = document.getElementById("provider-list");
  list.innerHTML = "";

  const provBtns = [];
  if(ch.embeds.length > 1){
    ch.embeds.forEach((e, i) => {
      const btn = document.createElement("button");
      btn.className = "prov-btn";
      btn.textContent = e.provider || ("Fonte " + (i + 1));
      btn.onclick = () => loadEmbed(e.url, provBtns, i);
      list.appendChild(btn);
      provBtns.push(btn);
    });
    bar.classList.add("visible");
  } else {
    bar.classList.remove("visible");
  }

  loadEmbed(ch.embeds[0].url, provBtns, 0);
  log("Canal: " + name, "inf");
}

function renderChannels(data){
  channelMap = data;
  const container = document.getElementById("channels-list");
  container.innerHTML = "";
  const entries = Object.entries(data);

  if(entries.length === 0){
    if(!autoStartDone)
      container.innerHTML = '<span class="ch-empty">Buscando canais...</span>';
    else
      container.innerHTML = '<span class="ch-empty">Nenhum canal disponível</span>';
    return;
  }

  entries.forEach(([name]) => {
    const btn = document.createElement("button");
    btn.className = "ch-btn" + (name === activeChannel ? " active" : "");
    btn.textContent = name;
    btn.dataset.name = name;
    btn.onclick = () => selectChannel(name);
    container.appendChild(btn);
  });

  log(entries.length + " canal(is) disponível(is)", "ok");

  if(!autoStartDone){
    const first = container.querySelector(".ch-btn");
    if(first){ first.click(); autoStartDone = true; }
  }
}

function toggleFullscreen(){
  const wrap = document.querySelector(".video-wrap");
  if(document.fullscreenElement){
    document.exitFullscreen();
  } else {
    (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
  }
}

(function connectSSE(){
  const es = new EventSource("/events");
  es.addEventListener("channels_updated", e => {
    try { renderChannels(JSON.parse(e.data)); }
    catch(err) { console.error("SSE parse error", err); }
  });
  es.addEventListener("scrape_log", e => {
    try { const d = JSON.parse(e.data); log(d.msg, d.t); }
    catch(err) {}
  });
  es.onerror = () => { es.close(); setTimeout(connectSSE, 5000); };
})();
</script>
</body>
</html>

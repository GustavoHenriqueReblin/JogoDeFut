<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#e8ff47"/>
  <meta name="description" content="Futebol ao vivo grátis"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/logo-32.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/logo-192.png"/>
  <link rel="shortcut icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" href="/static/icons/logo-192.png"/>
  <title>Gol AO VIVO TV</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;
      --accent:#e8ff47;--accent2:#47ffe8;--text:#e8e8f0;
      --muted:#555570;--error:#ff4757;
      --plyr-color-main:#e8ff47;
      --plyr-video-background:#000;
      --plyr-font-family:'DM Mono',monospace;
      --plyr-control-radius:6px;
      --plyr-control-icon-size:18px;
      --plyr-range-fill-background:#e8ff47;
      --plyr-video-controls-background:linear-gradient(transparent,rgba(0,0,0,.85));
    }
    body{
      background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;padding:32px 16px;gap:20px;
    }
    body::before{
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(var(--border) 1px,transparent 1px),
        linear-gradient(90deg,var(--border) 1px,transparent 1px);
      background-size:48px 48px;opacity:.25;pointer-events:none;z-index:0;
    }

    header{position:relative;z-index:1;text-align:center}
    header h1{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;color:var(--accent)}

    /* Player */
    .video-wrap{
      position:relative;z-index:1;width:100%;max-width:900px;
      border-radius:12px;overflow:hidden;border:1px solid var(--border);
      background:#000;
    }
    .plyr{--plyr-color-main:#e8ff47;border-radius:12px}
    .plyr--video .plyr__control:hover{background:var(--accent);color:#000}
    .plyr--video .plyr__control--overlaid{background:rgba(232,255,71,.15);border:1px solid rgba(232,255,71,.3)}
    .plyr--video .plyr__control--overlaid:hover{background:var(--accent)}
    .plyr--video .plyr__control--overlaid svg{color:#fff}
    .plyr--video .plyr__control--overlaid:hover svg{color:#000}

    .overlay{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:12px;z-index:10;
      background:#000;font-family:'DM Mono',monospace;font-size:.85rem;
      color:var(--muted);transition:opacity .2s;pointer-events:none;
    }
    .overlay.hidden{opacity:0}
    .spinner{
      width:32px;height:32px;border:3px solid var(--border);
      border-top-color:var(--accent2);border-radius:50%;
      animation:spin .8s linear infinite;display:none;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Channels */
    .section{
      position:relative;z-index:1;width:100%;max-width:900px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;
    }
    .section-title{
      font-family:'DM Mono',monospace;font-size:.62rem;
      color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
    }
    .ch-scroll-wrap{position:relative;display:flex;align-items:stretch}
    .scroll-btn{
      background:none;border:none;color:var(--muted);
      font-size:.75rem;padding:0 10px;cursor:pointer;flex-shrink:0;
      transition:color .15s;user-select:none;display:flex;align-items:center;
    }
    .scroll-btn:hover{color:var(--accent)}
    .scroll-btn svg{display:block}
    .btn-list{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;flex:1}
    .btn-list::-webkit-scrollbar{display:none}
    .ch-btn{
      background:transparent;border:1px solid var(--border);color:var(--text);
      font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;
      border-radius:8px;padding:10px 14px;cursor:pointer;transition:all .15s;
      display:flex;flex-direction:column;align-items:center;gap:6px;min-width:80px;flex-shrink:0;
    }
    .ch-btn:hover{border-color:var(--accent)}
    .ch-btn.active{border-color:var(--accent);background:rgba(232,255,71,.07)}
    .ch-btn:disabled{opacity:.4;cursor:wait}
    .ch-btn img{height:28px;width:auto;max-width:72px;object-fit:contain}
    .empty{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted)}


    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  </style>
</head>
<body>

<header>
  <h1>⚽ GOL AO VIVO TV</h1>
</header>

<div class="video-wrap">
  <video id="player" playsinline></video>
  <div class="overlay" id="overlay">
    <div class="spinner" id="spinner"></div>
    <span id="overlay-msg">Selecione um canal</span>
  </div>
</div>

<div class="section">
  <div class="section-title">Canais</div>
  <div class="ch-scroll-wrap">
    <button class="scroll-btn" id="scroll-left">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 4 6 8 10 12"/></svg>
    </button>
    <div class="btn-list" id="channels-list">
      <span class="empty">Carregando...</span>
    </div>
    <button class="scroll-btn" id="scroll-right">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 10 8 6 12"/></svg>
    </button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

const videoEl    = document.getElementById('player');
const overlay    = document.getElementById('overlay');
const spinner    = document.getElementById('spinner');
const overlayMsg = document.getElementById('overlay-msg');

const player = new Plyr(videoEl, {
  controls: ['mute','volume','fullscreen'],
  clickToPlay: false,
  volume: 0.5,
  hideControls: true,
  resetOnEnd: false,
  storage: { enabled: false },
});

let hls = null;
let activeUrl = null;

function showOverlay(msg, loading = false) {
  overlay.classList.remove('hidden');
  overlayMsg.textContent = msg;
  spinner.style.display = loading ? 'block' : 'none';
}

function hideOverlay() {
  overlay.classList.add('hidden');
}

function playStream(encUrl) {
  if (hls) { hls.destroy(); hls = null; }

  const streamUrl = '/stream?url=' + encUrl;

  if (Hls.isSupported()) {
    hls = new Hls({ enableWorker: false });
    hls.loadSource(streamUrl);
    hls.attachMedia(videoEl);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      hideOverlay();
      player.play().catch(() => {});
      player.fullscreen.enter();
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) showOverlay('Falha ao reproduzir. Por favor, recarregue a página.');
    });
  } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    player.source = { type: 'video', sources: [{ src: streamUrl, type: 'application/x-mpegURL' }] };
    videoEl.addEventListener('loadedmetadata', () => {
      hideOverlay();
      player.play().catch(() => {});
      player.fullscreen.enter();
    }, { once: true });
  } else {
    showOverlay('HLS não suportado neste browser');
  }
}

function selectChannel(name, url) {
  if (activeUrl === url) return;
  activeUrl = url;

  document.querySelectorAll('.ch-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.url === url);
    b.disabled = true;
  });

  showOverlay('Carregando…', true);
  document.querySelectorAll('.ch-btn').forEach(b => { b.disabled = false; });
  playStream(url);
}

(async function init() {
  const list = document.getElementById('channels-list');
  try {
    const channels = await fetch('/channels').then(r => r.json());
    if (!channels.length) {
      list.innerHTML = '<span class="empty">Nenhum canal configurado</span>';
      return;
    }
    list.innerHTML = '';
    channels.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'ch-btn';
      btn.dataset.url = ch.url;
      btn.onclick = () => selectChannel(ch.name, ch.url);

      const img = document.createElement('img');
      img.src = '/static/logos/' + ch.name + '.webp';
      img.alt = ch.name;
      img.onerror = () => img.remove();

      const label = document.createElement('span');
      label.textContent = ch.name;

      btn.appendChild(img);
      btn.appendChild(label);
      list.appendChild(btn);
    });
  } catch {
    list.innerHTML = '<span class="empty">Erro ao carregar canais</span>';
  }
})();

const chList = document.getElementById('channels-list');
document.getElementById('scroll-left').addEventListener('click', () => {
  chList.scrollBy({ left: -240, behavior: 'smooth' });
});
document.getElementById('scroll-right').addEventListener('click', () => {
  chList.scrollBy({ left: 240, behavior: 'smooth' });
});
</script>
</body>
</html>

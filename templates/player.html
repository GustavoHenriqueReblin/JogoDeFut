<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#e8ff47"/>
  <meta name="description" content="Futebol ao vivo grátis"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/logo-32.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/logo-192.png"/>
  <link rel="shortcut icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" href="/static/icons/logo-192.png"/>
  <title>Gol AO VIVO TV</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
  <link rel="stylesheet" href="/static/css/player.css?v={{ v }}"/>
  <link rel="stylesheet" href="/static/css/footer-panel.css?v={{ v }}"/>
</head>
<body>

<header>
  <h1>⚽ GOL AO VIVO TV</h1>
</header>

<div class="video-wrap" id="video-wrap">
  <video id="player" playsinline></video>
  <div class="overlay" id="overlay">
    <div class="spinner" id="spinner"></div>
    <span id="overlay-msg">Selecione um canal</span>
    <button class="retry-btn" id="retry-btn">Tentar novamente</button>
  </div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="/static/js/player-core.js?v={{ v }}"></script>
<script src="/static/js/footer-panel.js?v={{ v }}"></script>
<script src="/static/js/app.js?v={{ v }}"></script>

</body>
</html>
